<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <!-- Tiêu đề và mô tả (SEO) -->
  <title>Thế Giới Jack - Cửa Hàng Điện Tử Chính Hãng</title>
  <meta name="description" content="Cung cấp sản phẩm điện tử chính hãng, giá tốt nhất thị trường." />
  <link rel="canonical" href="https://thegioijack.vercel.app/" />

  <!-- Icon & Logo -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Open Graph (Facebook, Zalo, LinkedIn) -->
  <meta property="og:title" content="Thế Giới Jack - Cửa Hàng Điện Tử Chính Hãng" />
  <meta property="og:description" content="Cung cấp sản phẩm công nghệ chất lượng cao, giá cả phải chăng." />
  <meta property="og:image" content="https://thegioijack.vercel.app/images/banner.jpg" />
  <meta property="og:url" content="https://thegioijack.vercel.app" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card (SEO cho Twitter) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Thế Giới Jack - Cửa Hàng Điện Tử Chính Hãng" />
  <meta name="twitter:description" content="Sản phẩm điện tử chính hãng, giá cả cạnh tranh nhất thị trường." />
  <meta name="twitter:image" content="https://thegioijack.vercel.app/images/banner.jpg" />

  <!-- Robots (Chỉ dẫn cho trình thu thập dữ liệu) -->
  <meta name="robots" content="index, follow" />

</head>

<body>
  <noscript>Bạn cần bật JavaScript để chạy ứng dụng này.</noscript>
  <div id="root"></div>

  <!-- Google Analytics (Theo dõi lưu lượng truy cập) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

</body>

</html>
